name: Russian localization validation
on:
  push:
    branches: [feature/russian-localization]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-russian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
